[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-edge"
version = "0.1.0"
description = "ATLAS single-origin edge: mounts finance, scheduling, risk and the MCP server behind one public URL."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "starlette>=0.37",
  "httpx>=0.26",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_edge*"]