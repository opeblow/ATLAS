[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-finance-service"
version = "0.1.0"
description = "ATLAS finance service: append-only ledger, affordability checks, risk snapshots."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
  "sqlalchemy>=2.0",
  "httpx>=0.26",
  "atlas-common>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]