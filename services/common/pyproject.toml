[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-common"
version = "0.1.0"
description = "Shared data layer for ATLAS services: SQLAlchemy models, config, audit logging."
requires-python = ">=3.10"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "PyJWT[crypto]>=2.8,<3",
]

[project.optional-dependencies]
# Redis backs the shared rate-limit counter and the hot-read cache. Both are
# optional: without REDIS_URL the code falls back to in-process structures, which
# is correct for a single worker but silently multiplies the rate limit by the
# worker count. Install this on any deployment running more than one worker.
redis = ["redis>=5.0,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_common*"]