# ATLAS local/production-shaped stack.
#
# Topology note: atlas-edge is the only service published to the host (plus the
# dashboard). The four application services use `expose:` instead of `ports:`,
# which keeps them on the internal compose network only. CORS is not access
# control -- a non-browser client ignores it -- so publishing 8000-8003 would let
# anything that can reach this host skip the edge entirely, and with it the rate
# limiter, the 64 KiB body ceiling, and request normalisation.
#
# REDIS_URL is set on edge so the limiter counts across all uvicorn workers.
# Without it each worker keeps a private counter and the effective limit silently
# multiplies by the worker count.
#
# Every service runs with no-new-privileges so a compromised process cannot gain
# privileges via a setuid binary, and carries a memory/CPU ceiling so one service
# under load (or a runaway log) cannot starve the host and take the rest of the
# stack down with it.

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *hardened
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: always
    environment:
      POSTGRES_USER: atlas_user
      POSTGRES_PASSWORD: atlas_password
      POSTGRES_DB: atlas_prod
    # Published for psql/dBeaver during development. Drop this mapping in any
    # deployment reachable from outside the host.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_user -d atlas_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    <<: *hardened
    image: redis:7-alpine
    container_name: atlas-redis
    restart: always
    # Not published: only the edge needs it, over the internal network. An
    # unauthenticated Redis on a routable port is a remote-code-execution path.
    expose:
      - "6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  risk-model:
    <<: *hardened
    build:
      context: .
      dockerfile: services/risk-model/Dockerfile
    container_name: atlas-risk-model
    restart: always
    expose:
      - "8000"
    environment:
      - PORT=8000
    # torch holds the model and its arena resident, so this gets a larger budget
    # than the plain HTTP services.
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  finance-service:
    <<: *hardened
    build:
      context: .
      dockerfile: services/finance-service/Dockerfile
    container_name: atlas-finance-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      risk-model:
        condition: service_healthy
    expose:
      - "8001"
    environment:
      - PORT=8001
      - ATLAS_DATABASE_URL=postgresql://atlas_user:atlas_password@postgres:5432/atlas_prod
      - RISK_MODEL_URL=http://risk-model:8000
      - ATLAS_AUTH_MODE=dev
      - ATLAS_REQUIRE_AUTH=0
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  scheduling-service:
    <<: *hardened
    build:
      context: .
      dockerfile: services/scheduling-service/Dockerfile
    container_name: atlas-scheduling-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8002"
    environment:
      - PORT=8002
      - ATLAS_DATABASE_URL=postgresql://atlas_user:atlas_password@postgres:5432/atlas_prod
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-server:
    <<: *hardened
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: atlas-mcp-server
    restart: always
    depends_on:
      finance-service:
        condition: service_healthy
      scheduling-service:
        condition: service_healthy
    expose:
      - "8003"
    environment:
      - PORT=8003
      - FINANCE_SERVICE_URL=http://finance-service:8001
      - SCHEDULING_SERVICE_URL=http://scheduling-service:8002
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # The single public entrypoint. Every request crosses the security middleware
  # here, so this must sit in front of the four services.
  edge:
    <<: *hardened
    build:
      context: .
      dockerfile: services/edge/Dockerfile
    container_name: atlas-edge
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      risk-model:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      scheduling-service:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - ATLAS_DATABASE_URL=postgresql://atlas_user:atlas_password@postgres:5432/atlas_prod
      - ATLAS_RISK_MODEL_URL=http://risk-model:8000
      - ATLAS_FINANCE_URL=http://finance-service:8001
      - ATLAS_SCHEDULING_URL=http://scheduling-service:8002
      # ATLAS_REQUIRE_AUTH=0 alone no longer disables auth: config.py computes
      # require_auth as `auth_mode != "dev" || ATLAS_REQUIRE_AUTH`, so dev mode
      # must be selected explicitly. A real deployment sets cognito + 1 instead.
      - ATLAS_AUTH_MODE=dev
      - ATLAS_REQUIRE_AUTH=0
      - ATLAS_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # Nothing rewrites X-Forwarded-For in this stack, so the raw peer address is
      # the honest identifier. Leaving this off is what keeps a spoofed header from
      # handing a caller a fresh rate-limit bucket.
      - ATLAS_TRUST_PROXY_HEADERS=0
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/edge/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    <<: *hardened
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      # Baked into the bundle at build time; the Dockerfile fails without it.
      args:
        NEXT_PUBLIC_ATLAS_URL: http://localhost:8000
    container_name: atlas-dashboard
    restart: always
    depends_on:
      edge:
        condition: service_healthy
    ports:
      - "3000:8080" # nginx-unprivileged listens on 8080 inside the container
    mem_limit: 128m
    cpus: "0.5"

volumes:
  postgres_data:
