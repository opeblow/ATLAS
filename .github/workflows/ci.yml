name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Default to read-only. Individual jobs opt in to more where they need it.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs, not mutable tags. A tag like
# @v4 can be repointed at new code by anyone able to push to that tag's repo,
# and that code would then execute in this workflow. Dependabot bumps the SHAs.
jobs:
  backend:
    name: backend · unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch (CPU-only, smaller artifact)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install ATLAS packages (editable)
        run: |
          pip install -e services/common
          pip install -e services/risk-model
          pip install -e services/finance-service
          pip install -e services/scheduling-service
          pip install -e mcp-server
          pip install -e reasoning/bedrock-orchestrator
          pip install pytest pytest-asyncio httpx

      - name: Unit tests (no services required)
        run: |
          cd services/scheduling-service
          python -m pytest tests -q
          cd ../../reasoning/bedrock-orchestrator
          python -m pytest tests -q

      - name: Shared-library tests (auth + rate limiter)
        working-directory: services/common
        run: python -m pytest tests -q

      - name: Train the risk model (weights are gitignored, so CI trains them)
        working-directory: services/risk-model
        run: python -m app.train

      - name: Boot the stack (risk → finance → scheduling → mcp)
        run: |
          export ATLAS_DATABASE_URL=sqlite:///$GITHUB_WORKSPACE/atlas_ci.db
          # ATLAS_AUTH_MODE=dev is what actually disables auth now. config.py
          # computes require_auth as `auth_mode != "dev" || ATLAS_REQUIRE_AUTH`,
          # so setting only ATLAS_REQUIRE_AUTH=0 leaves the default cognito mode
          # enforcing auth and this credential-free suite fails on 401.
          export ATLAS_AUTH_MODE=dev
          export ATLAS_REQUIRE_AUTH=0
          cd services/risk-model
          (nohup python -m uvicorn app.main:app --port 8000 --log-level warning >/tmp/risk.log 2>&1 &)
          cd ../finance-service
          (nohup python -m uvicorn app.main:app --port 8001 --log-level warning >/tmp/finance.log 2>&1 &)
          cd ../scheduling-service
          (nohup python -m uvicorn app.main:app --port 8002 --log-level warning >/tmp/schedule.log 2>&1 &)
          cd ../../mcp-server
          (nohup python -m uvicorn atlas_mcp_server.server:app --port 8003 --log-level warning >/tmp/mcp.log 2>&1 &)

      - name: Wait for all four services
        run: |
          for i in $(seq 1 60); do
            ok=1
            for p in 8000 8001 8002 8003; do
              if ! curl -fsS "http://127.0.0.1:$p/health" >/dev/null 2>&1; then ok=0; fi
            done
            [ "$ok" = "1" ] && break
            sleep 2
          done
          for p in 8000 8001 8002 8003; do
            curl -fsS "http://127.0.0.1:$p/health" || { echo "health check failed on $p"; cat /tmp/risk.log /tmp/finance.log /tmp/schedule.log /tmp/mcp.log; exit 1; }
          done
          curl -fsS "http://127.0.0.1:8000/score/demo" >/dev/null || {
            echo "risk model is up but cannot score - trained artifact missing?"; cat /tmp/risk.log; exit 1;
          }

      - name: E2E — MCP integration suite (auth off)
        run: |
          cd mcp-server
          python -m pytest tests -q

  dashboard:
    name: dashboard · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Build
        working-directory: dashboard
        # prebuild (check-backend-url.mjs) requires this; without it the bundle
        # would inline an unset origin and every fetch would hit localhost.
        env:
          NEXT_PUBLIC_ATLAS_URL: https://api.atlas.example.com
        run: npm run build

  terraform:
    name: infra · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.8.5"

      - name: Format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

  supply-chain:
    name: supply chain · dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to post the summary comment; the API itself is read-only.
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Reviews the dependency delta introduced by the PR (not the whole
      # manifest), so it fails on newly introduced advisories and licence drift.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-on-pr: on-failure

  secrets:
    name: secrets · no credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history, so a secret that was later deleted is still caught

      # .gitignore already excludes *.pem/*.key/.env; this covers a secret that
      # was force-added or written to a tracked file.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
