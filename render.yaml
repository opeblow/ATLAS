# ATLAS on Render — single-origin backend.
#
# Why one service instead of four: finance, scheduling, MCP and audit data all
# share one PostgreSQL database. Separate Render services would each get their own
# filesystem, so they would not see each other's writes. services/edge mounts
# all four ASGI apps behind a single port and keeps the multi-service
# architecture intact.
#
# The dashboard is a static export deployed separately to Cloudflare Pages; see
# docs/deployment.md.
services:
  - type: web
    name: atlas
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    pythonVersion: "3.12.7"
    # torch is pinned to the CPU wheel index: the GPU build is ~2.5GB and would
    # make the build time out for no benefit on this model.
    buildCommand: >-
      pip install --upgrade pip
      && pip install "numpy>=1.26" "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      && pip install
      -e "./services/common[redis]"
      -e ./services/edge
      -e ./services/finance-service
      -e ./services/scheduling-service
      -e ./services/risk-model
      -e ./mcp-server
      -e ./reasoning/bedrock-orchestrator
    startCommand: python -m atlas_edge.asgi
    healthCheckPath: /edge/health
    autoDeploy: true

    envVars:
      # ATLAS_SELF_URL is deliberately NOT set. Render injects a dynamic PORT and
      # atlas_edge.asgi defaults ATLAS_SELF_URL to http://127.0.0.1:$PORT, which is
      # what the internal sub-service calls need. Pinning it to :8000 (as this
      # file previously did) makes every self-call fail whenever Render assigns a
      # different port, with a connection-refused rather than anything obvious.

      # Render terminates TLS and sets X-Forwarded-For itself, so request.client is
      # the proxy for every request. Without this flag every anonymous caller
      # shares a single bucket, so one unauthenticated client can exhaust the
      # /auth/token budget for everyone.
      - key: ATLAS_TRUST_PROXY_HEADERS
        value: "1"

      # The shared rate-limit counter. Required once the service runs more than one
      # instance, since the in-process table is private to each one and would
      # otherwise multiply every configured limit by the instance count. Safe to
      # leave unset on the free plan: the limiter fails open to the local table.
      - key: REDIS_URL
        sync: false

      # Require an external managed Postgres URL; never persist multi-user data
      # on Render's ephemeral filesystem.
      - key: ATLAS_DATABASE_URL
        sync: false
      - key: ATLAS_SEED_ON_START
        value: "0"
      # The Render service is a demo host, not the production scale target.
      - key: ATLAS_MOCK_BEDROCK
        value: "1"
      # Fail closed: Cognito configuration must be supplied before user APIs work.
      - key: ATLAS_AUTH_MODE
        value: cognito
      - key: ATLAS_REQUIRE_AUTH
        value: "1"
      - key: ATLAS_COGNITO_USER_POOL_ID
        sync: false
      - key: ATLAS_COGNITO_APP_CLIENT_ID
        sync: false
      - key: ATLAS_COGNITO_ISSUER
        sync: false
      - key: AWS_REGION
        sync: false
      # The Cloudflare Pages origin, once it exists. Comma-separated.
      - key: ATLAS_CORS_ORIGINS
        sync: false