# nginx config for the ATLAS static export.
#
# next.config.ts sets trailingSlash: true, so every route is emitted as
# <route>/index.html. `try_files ... /index.html` therefore resolves /money to
# /money/index.html. The /index.html fallback is a safety net for a missing
# trailing slash, not a SPA rewrite: /nope must 404 rather than silently return
# the home page.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Mirrors dashboard/public/_headers, which Cloudflare Pages and Netlify read.
    # nginx ignores _headers (it is not an nginx include), so the headers are
    # restated here to keep the containerised path equally hardened.
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'" always;

    location /_next/static/ {
        # Hashed filenames: safe to cache immutably.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        # HTML must never be cached stale or a security fix sits behind a CDN.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/index.html /index.html =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Never let a stray upload write into the image.
    location ~ /\. { deny all; }
}
