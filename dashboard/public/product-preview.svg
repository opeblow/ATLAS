<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img" aria-labelledby="pp-title pp-desc">
  <title id="pp-title">The ATLAS dashboard</title>
  <desc id="pp-desc">A product preview of ATLAS: a left navigation rail, three summary figures for spend, risk and today's schedule, a twelve-week spend trend, and a list of today's commitments.</desc>

